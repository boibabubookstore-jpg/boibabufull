<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found - BoiBabu</title>
    <meta name="description" content="The page you're looking for doesn't exist. Browse our collection of books at BoiBabu.in" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://boibabu.in/404" />
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin: 0;
            opacity: 0.8;
        }
        .error-message {
            font-size: 1.5rem;
            margin: 1rem 0 2rem 0;
        }
        .description {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        .btn-primary {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border-color: transparent;
        }
        .btn-primary:hover {
            background: white;
            color: #5a67d8;
        }
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            .error-message {
                font-size: 1.2rem;
            }
            .actions {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="description">
            The page you're looking for doesn't exist or has been moved. 
            Don't worry, you can find what you're looking for from our homepage or browse our book collection.
        </p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/books" class="btn">Browse Books</a>
            <a href="javascript:history.back()" class="btn">Go Back</a>
        </div>
    </div>

    <!-- Redirect common 404 patterns -->
    <script>
        (function() {
            const path = window.location.pathname.toLowerCase();
            const search = window.location.search;
            
            // Common redirect patterns
            const redirects = {
                '/book/': '/books/',
                '/category/': '/books?category=',
                '/search/': '/books?search=',
                '/product/': '/books/',
                '/item/': '/books/'
            };
            
            for (const [oldPath, newPath] of Object.entries(redirects)) {
                if (path.startsWith(oldPath)) {
                    const remainder = path.substring(oldPath.length);
                    let redirectTo;
                    
                    if (newPath.includes('?')) {
                        redirectTo = newPath + encodeURIComponent(remainder);
                        if (search) {
                            redirectTo += '&' + search.substring(1);
                        }
                    } else {
                        redirectTo = newPath + remainder + search;
                    }
                    
                    window.location.replace(redirectTo);
                    return;
                }
            }
            
            // Remove trailing slashes and redirect
            if (path.length > 1 && path.endsWith('/')) {
                window.location.replace(path.slice(0, -1) + search);
                return;
            }
        })();
    </script>
</body>
</html>
