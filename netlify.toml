[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  REACT_APP_API_URL = "https://boibabufull.vercel.app"
  GENERATE_SOURCEMAP = "false"

# Legacy URL redirects

[[redirects]]
  from = "/book/:id"
  to = "/books/:id"
  status = 301

[[redirects]]
  from = "/category/:category"
  to = "/books?category=:category"
  status = 301

[[redirects]]
  from = "/search/:query"
  to = "/books?search=:query"
  status = 301

# Case-insensitive redirects

[[redirects]]
  from = "/Books"
  to = "/books"
  status = 301

[[redirects]]
  from = "/Books/*"
  to = "/books/:splat"
  status = 301

[[redirects]]
  from = "/LOGIN"
  to = "/login"
  status = 301

[[redirects]]
  from = "/REGISTER"
  to = "/register"
  status = 301

# SPA routing - MUST BE LAST

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
